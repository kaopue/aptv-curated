name: Update APTV Curated Playlist

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "update_aptv.py"
      - ".github/workflows/update-aptv.yml"
  schedule:
    - cron: "23 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate playlist
        run: python update_aptv.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aptv_curated.m3u
          if git diff --cached --quiet; then
            echo "No playlist changes."
          else
            git commit -m "Auto-update APTV playlist"
            git push
          fi
